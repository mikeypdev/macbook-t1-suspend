# MacBookPro13,2: Alpine Ridge USB-C hotplug is missed when the xHCI USB3
# root hubs runtime-suspend (see 99-mbp132-usbc-runtime.rules). TLP matches
# USB devices by USB id, so the PCI id 8086:15d4 never matched — pin the
# root hubs (1d6b:0003) instead.
# Install to /etc/tlp.d/20-usb.conf
USB_DENYLIST="8086:15d4 1d6b:0003"
