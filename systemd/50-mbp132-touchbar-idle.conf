# MacBookPro13,2: the T1 (iBridge USB 05ac:8600) never runtime-suspends —
# gnome-shell keeps the touch-strip input node open, so usbhid holds a PM
# ref forever. The driver can still put the strip's display to sleep when
# idle: default 5 min is far too long on battery. 30 s keeps it dark during
# any pause; any key/touch relights it (the sleep hook re-sends mode with
# idle_timeout=-2, i.e. "saved", so the runtime attr value survives resumes).
# Install to /etc/modprobe.d/50-mbp132-touchbar-idle.conf
options apple_touchbar idle_timeout=30
