# MacBookPro13,2: battery-mode CPU/platform tuning (idle draw was 3x macOS).
# Applies whenever the machine runs on battery, including under GNOME
# "balanced" (tlp-pd maps balanced -> TLP auto mode).
# Install to /etc/tlp.d/40-battery.conf

# Favor maximum energy efficiency (HWP EPP) on battery
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# No Turbo Boost on battery: keeps package power flat under bursty load,
# negligible effect on interactive use on this 2-core Skylake
CPU_BOOST_ON_BAT=0

# Aggressive PCIe runtime PM on battery (root hubs stay pinned via 20-usb.conf)
RUNTIME_PM_ON_BAT=auto
