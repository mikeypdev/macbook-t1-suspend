# BCM43602 (MacBookPro13,2 wifi): firmware PSM watchdog hangs when 802.11
# power save is active, especially across warm S3 resumes.
#
# NetworkManager applies this setting every time it initializes a wifi
# device - including every resume, when the sleep hook's PCI rescan makes
# the card re-appear as a NEW device (new phy), long after TLP's resume
# hook ran (while the card was still removed). TLP's WIFI_PWR=off
# (tlp-30-wifi.conf) therefore loses that race; only NM itself can keep
# power save off at re-probe. A pre-kit conf with wifi.powersave=2 (enable)
# silently re-enabled PSM at every resume (2026-11-05 12:45 resume wedged:
# assoc rejects + EAPOL timeouts -> reboot).
# Install to /etc/NetworkManager/conf.d/macbook-wifi-powersave.conf
# Values: 0 = default, 1 = disable, 2 = enable, 3 = ignore.
[connection]
wifi.powersave=1
